<main>
  <h1>Weather Dashboard</h1>

  <div class="city-buttons">
    @for (cityOption of cities; track cityOption.value) {
      <button type="button" (click)="selectCity(cityOption.value)">
        {{ cityOption.label }}
      </button>
    }
  </div>

  <input
    [(ngModel)]="city"
    placeholder="e.g. new york, ny"
    (keyup.enter)="loadWeather()"
  />

  <button (click)="loadWeather()">Search</button>

  @if (loading()) {
    <p class="status">Loading weather ...</p>
  }

  @if (error()) {
    <p class="status error">{{ error }}</p>
  }

  @if (!loading()) {
    <app-current-weather [weather]="weather()" />
    <app-forecast [forecast]="forecast()" />
  }
</main>
